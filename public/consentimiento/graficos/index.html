<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
<title id="page-title">Resultados de la Encuesta · Stemwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #00B2C2; --verde-claro: #E6F7F9; --texto: #1C2B26; --gris: #6B7B76;
    --borde: #D4E6DF; --fondo: #F7FAF8; --blanco: #FFFFFF; --max-w: 560px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; }
  .header { background: var(--blanco); border-bottom: 1px solid var(--borde); padding: 10px 24px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 10; }
  .header img { height: 48px; width: auto; }
  .header-acciones { display: flex; gap: 10px; }
  .container { max-width: var(--max-w); margin: 0 auto; padding: 20px 20px 40px; }
  @media (min-width: 700px) { :root { --max-w: 760px; } }
  @media (min-width: 1000px) { :root { --max-w: 1040px; } }
  @media (min-width: 1300px) { :root { --max-w: 1280px; } }

  .titulo-simple { margin-bottom: clamp(16px, 2vh, 26px); }
  .titulo-simple h2 { font-size: clamp(22px, 2.8vw, 32px); font-weight: 800; color: var(--verde); margin-bottom: 6px; }
  .titulo-simple p { font-size: clamp(13px, 1vw, 15px); color: var(--gris); line-height: 1.4; }

  .filtros-row { display: flex; flex-wrap: wrap; align-items: center; gap: 14px; margin-bottom: 22px; padding: 12px 16px; background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px; }
  .filtro-campo { display: flex; align-items: center; gap: 8px; }
  .filtro-campo label { font-size: 12.5px; font-weight: 600; color: var(--gris); white-space: nowrap; }
  .filtro-select {
    padding: 8px 12px; border: 1.5px solid var(--borde); border-radius: 10px; background: var(--fondo);
    font-family: 'Poppins', sans-serif; font-size: 13px; color: var(--texto); cursor: pointer; -webkit-appearance: none;
  }
  .filtro-select:focus { outline: none; border-color: var(--verde); }
  .filtro-select:disabled { opacity: .5; cursor: not-allowed; }
  .filtro-resultado { font-size: 12px; color: var(--gris); margin-left: auto; }

  .btn-secundario {
    padding: 10px 18px; background: none; color: var(--gris); border: 1.5px solid var(--borde); border-radius: 12px;
    font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 500; cursor: pointer; transition: all .2s;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .btn-secundario:hover { border-color: var(--verde); color: var(--verde); }
  .btn-primario {
    padding: 10px 18px; background: var(--verde); color: white; border: none; border-radius: 12px;
    font-family: 'Poppins', sans-serif; font-size: 13.5px; font-weight: 600; cursor: pointer; transition: all .2s;
    display: inline-flex; align-items: center; gap: 8px; white-space: nowrap;
  }
  .btn-primario:hover { background: #0093a0; }

  .kpi-row { display: grid; grid-template-columns: repeat(auto-fit,minmax(160px,1fr)); gap: 12px; margin-bottom: 24px; }
  .kpi-card { background: var(--blanco); border: 1px solid var(--borde); border-radius: 14px; padding: 16px 18px; }
  .kpi-num { font-size: 26px; font-weight: 800; color: var(--verde); line-height: 1; }
  .kpi-label { font-size: 11.5px; color: var(--gris); margin-top: 6px; text-transform: uppercase; letter-spacing: .04em; font-weight: 600; }
  .kpi-sub { font-size: 11px; color: var(--gris); margin-top: 2px; }

  .section-label { font-size: 13px; text-transform: uppercase; letter-spacing: .05em; color: var(--texto); font-weight: 700; margin: 22px 0 12px; display: flex; align-items: center; gap: 8px; }
  .section-label::after { content: ''; flex: 1; height: 1px; background: var(--borde); }

  .pie-grid { display: grid; grid-template-columns: repeat(auto-fit,minmax(260px,1fr)); gap: 16px; }
  .pie-card { background: var(--blanco); border: 1px solid var(--borde); border-radius: 16px; padding: 18px 20px; break-inside: avoid; }
  .pie-card h4 { font-size: 13.5px; font-weight: 700; color: var(--texto); margin-bottom: 12px; line-height: 1.3; }
  .pie-wrap { display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .pie-legend { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
  .pie-legend-chip { display: inline-flex; align-items: center; gap: 6px; font-size: 11.5px; color: var(--texto); padding: 4px 10px; background: var(--fondo); border-radius: 20px; border: 1px solid var(--borde); font-weight: 500; }
  .pie-legend-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .pie-total { font-size: 11px; color: var(--gris); }

  .proc-card { background: var(--blanco); border: 1px solid var(--borde); border-radius: 16px; padding: 18px 20px; margin-bottom: 16px; }
  .proc-row { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
  .proc-label { font-size: 12.5px; color: var(--texto); width: 200px; flex-shrink: 0; }
  .proc-track { flex: 1; background: var(--fondo); border: 1px solid var(--borde); border-radius: 8px; height: 22px; overflow: hidden; position: relative; }
  .proc-fill { height: 100%; border-radius: 7px; display: flex; align-items: center; padding-left: 8px; }
  .proc-num { font-size: 11.5px; font-weight: 700; color: white; }
  .proc-pct { font-size: 11.5px; color: var(--gris); width: 40px; text-align: right; flex-shrink: 0; }

  .no-data { color: var(--gris); font-size: 13px; text-align: center; padding: 20px; }
  .spinner-wrap { text-align: center; padding: 40px; color: var(--gris); }

  @media print {
    .header-acciones, #btn-refrescar, #btn-volver, #btn-pdf, .filtros-row { display: none !important; }
    body { background: white; }
    .pie-card, .proc-card, .kpi-card { break-inside: avoid; box-shadow: none; }
    .header { position: static; }
  }
</style>
</head>
<body>

<header class="header">
  <img src="/images/STEMWELL_LOGO_.png" alt="Stemwell" />
  <div class="header-acciones">
    <button class="btn-secundario" id="btn-volver" type="button">← <span id="txt-volver">Volver</span></button>
    <button class="btn-primario" id="btn-pdf" type="button">🖨️ <span id="txt-pdf">Descargar PDF</span></button>
  </div>
</header>

<div class="container">
  <div class="titulo-simple">
    <h2 id="txt-titulo">Resultados de la Encuesta de Satisfacción</h2>
    <p id="txt-intro">Distribución de respuestas de todos los pacientes que han completado la encuesta.</p>
  </div>

  <div class="filtros-row">
    <div class="filtro-campo">
      <label for="sel-anio" id="lbl-anio">Año</label>
      <select class="filtro-select" id="sel-anio"></select>
    </div>
    <div class="filtro-campo">
      <label for="sel-mes" id="lbl-mes">Mes</label>
      <select class="filtro-select" id="sel-mes" disabled></select>
    </div>
    <span class="filtro-resultado" id="filtro-resultado"></span>
  </div>

  <div id="contenido">
    <div class="spinner-wrap" id="cargando">Cargando…</div>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TEXTOS = {
    es: {
      tituloPagina: 'Resultados de la Encuesta · Stemwell',
      titulo: 'Resultados de la Encuesta de Satisfacción',
      intro: 'Distribución de respuestas de todos los pacientes que han completado la encuesta.',
      volver: 'Volver',
      pdf: 'Descargar PDF',
      cargando: 'Cargando…',
      error: 'No se pudieron cargar los datos.',
      totalRespuestas: 'Total respuestas',
      satisfechos: 'Satisfechos (Muy bueno/Bueno)',
      recomiendan: 'Recomendarían la Clínica',
      enEspanol: 'Respuestas en Español',
      enIngles: 'en inglés',
      seccionPreguntas: 'Distribución por pregunta',
      seccionProcedimientos: 'Procedimientos mencionados',
      procNota: 'Una misma encuesta puede mencionar varios procedimientos.',
      sinDatos: 'Sin datos todavía.',
      respuestas: 'respuestas',
      respuesta: 'respuesta',
      personalTitulo: '¿Cómo califica el personal asistencia médico?',
      recomendariaTitulo: '¿Recomendaría la Clínica a un familiar o amigo(a)?',
      satisfaccionTitulo: '¿Qué tan satisfecho está con el servicio brindado?',
      instalacionesTitulo: '¿Cómo calificaría las instalaciones de la Clínica?',
      claridadTitulo: '¿Qué tan clara fue la información brindada por el personal?',
      etiquetaAnio: 'Año',
      etiquetaMes: 'Mes',
      todos: 'Todos',
      mostrando: 'Mostrando',
      meses: ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'],
    },
    en: {
      tituloPagina: 'Survey Results · Stemwell',
      titulo: 'Satisfaction Survey Results',
      intro: 'Distribution of responses from every patient who has completed the survey.',
      volver: 'Back',
      pdf: 'Download PDF',
      cargando: 'Loading…',
      error: 'Could not load the data.',
      totalRespuestas: 'Total responses',
      satisfechos: 'Satisfied (Very Good/Good)',
      recomiendan: 'Would recommend the Clinic',
      enEspanol: 'Responses in Spanish',
      enIngles: 'in English',
      seccionPreguntas: 'Distribution by question',
      seccionProcedimientos: 'Procedures mentioned',
      procNota: 'A single survey can mention more than one procedure.',
      sinDatos: 'No data yet.',
      respuestas: 'responses',
      respuesta: 'response',
      personalTitulo: 'How would you rate the care provided by the medical staff?',
      recomendariaTitulo: 'Would you recommend the Clinic to a family member or friend?',
      satisfaccionTitulo: 'How satisfied are you with the service provided?',
      instalacionesTitulo: 'How would you rate the facilities of the Clinic?',
      claridadTitulo: 'How clear was the information provided by the staff?',
      etiquetaAnio: 'Year',
      etiquetaMes: 'Month',
      todos: 'All',
      mostrando: 'Showing',
      meses: ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'],
    }
  };

  var ESCALA4 = [
    { valor: 4, es: 'Muy bueno', en: 'Very Good' },
    { valor: 3, es: 'Bueno', en: 'Good' },
    { valor: 2, es: 'Malo', en: 'Bad' },
    { valor: 1, es: 'Muy malo', en: 'Very Bad' }
  ];
  var ESCALA5 = [
    { valor: 5, es: 'Muy buena', en: 'Very Good' },
    { valor: 4, es: 'Buena', en: 'Good' },
    { valor: 3, es: 'Regular', en: 'Fair' },
    { valor: 2, es: 'Mala', en: 'Bad' },
    { valor: 1, es: 'Muy mala', en: 'Very Bad' }
  ];
  var ESCALA_RECOMENDACION = [
    { valor: 4, es: 'Definitivamente sí', en: 'Definitely Yes' },
    { valor: 3, es: 'Probablemente sí', en: 'Probably Yes' },
    { valor: 2, es: 'Probablemente no', en: 'Probably no' },
    { valor: 1, es: 'Definitivamente no', en: 'Definitely no' }
  ];
  var PROCEDIMIENTOS = {
    ortobiologicos: { es: 'Ortobiológicos (Células madre, exosomas, PRP)', en: 'Orthobiologics (Stem Cells, Exosomes, PRP)' },
    camara_hiperbarica: { es: 'Cámara Hiperbárica', en: 'Hyperbaric Chamber' },
    terapia_avanzada: { es: 'Terapia Avanzada', en: 'Advanced Therapy' },
    consulta_medica: { es: 'Consulta médica', en: 'Medical Consultation' },
    infusion_multivitaminicos: { es: 'Infusión endovenosa de complejos multivitamínicos', en: 'Intravenous Infusion of Multivitamin Complexes' },
    otro: { es: 'Otro', en: 'Other' }
  };
  var PREGUNTAS = [
    { campo: 'satisfaccion_general', tituloKey: 'satisfaccionTitulo', escala: ESCALA4 },
    { campo: 'calificacion_personal', tituloKey: 'personalTitulo', escala: ESCALA4 },
    { campo: 'recomendaria', tituloKey: 'recomendariaTitulo', escala: ESCALA_RECOMENDACION },
    { campo: 'calificacion_instalaciones', tituloKey: 'instalacionesTitulo', escala: ESCALA5 },
    { campo: 'claridad_informacion', tituloKey: 'claridadTitulo', escala: ESCALA5 },
  ];
  var PALETA = ['#00B2C2', '#3B82F6', '#F59E0B', '#EF4444', '#A855F7'];

  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'en' ? 'en' : 'es';
  var t = TEXTOS[lang];

  document.documentElement.lang = lang;
  document.getElementById('page-title').textContent = t.tituloPagina;
  document.getElementById('txt-titulo').textContent = t.titulo;
  document.getElementById('txt-intro').textContent = t.intro;
  document.getElementById('txt-volver').textContent = t.volver;
  document.getElementById('txt-pdf').textContent = t.pdf;
  document.getElementById('cargando').textContent = t.cargando;
  document.getElementById('lbl-anio').textContent = t.etiquetaAnio;
  document.getElementById('lbl-mes').textContent = t.etiquetaMes;

  document.getElementById('btn-volver').addEventListener('click', function () {
    window.location.href = '/consentimiento/?lang=' + lang;
  });
  document.getElementById('btn-pdf').addEventListener('click', function () {
    window.print();
  });

  function escapeHtml(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function etiquetaEscala(escala, valor) {
    var op = escala.filter(function (o) { return o.valor === valor; })[0];
    return op ? op[lang] : String(valor);
  }

  function buildPieSVG(dist, escala) {
    var total = dist.reduce(function (s, d) { return s + d.count; }, 0);
    if (!total) return '<div class="no-data">' + t.sinDatos + '</div>';
    var size = 170, r = size / 2 - 4, cx = size / 2, cy = size / 2;
    var angle = -Math.PI / 2, paths = '';
    var datos = dist.map(function (d, i) {
      return { etiqueta: etiquetaEscala(escala, d.valor), count: d.count, color: PALETA[i % PALETA.length] };
    });
    datos.forEach(function (d) {
      var frac = d.count / total;
      var angleEnd = angle + frac * Math.PI * 2;
      var x1 = cx + r * Math.cos(angle), y1 = cy + r * Math.sin(angle);
      var x2 = cx + r * Math.cos(angleEnd), y2 = cy + r * Math.sin(angleEnd);
      var largeArc = (angleEnd - angle) > Math.PI ? 1 : 0;
      if (datos.length === 1) {
        paths += '<circle cx="' + cx + '" cy="' + cy + '" r="' + r + '" fill="' + d.color + '"/>';
      } else {
        paths += '<path d="M' + cx + ',' + cy + ' L' + x1 + ',' + y1 + ' A' + r + ',' + r + ' 0 ' + largeArc + ' 1 ' + x2 + ',' + y2 + ' Z" fill="' + d.color + '" stroke="#fff" stroke-width="1.5"/>';
      }
      angle = angleEnd;
    });
    var legend = datos.map(function (d) {
      var pct = Math.round(d.count / total * 100);
      return '<span class="pie-legend-chip"><span class="pie-legend-dot" style="background:' + d.color + '"></span>' + escapeHtml(d.etiqueta) + ' · ' + d.count + ' (' + pct + '%)</span>';
    }).join('');
    return '<div class="pie-wrap">' +
      '<svg viewBox="0 0 ' + size + ' ' + size + '" width="' + size + '" height="' + size + '">' + paths + '</svg>' +
      '<div class="pie-legend">' + legend + '</div>' +
      '<div class="pie-total">' + total + ' ' + (total === 1 ? t.respuesta : t.respuestas) + '</div>' +
      '</div>';
  }

  function pctEnEtiquetas(dist, escala, etiquetasEs) {
    var total = dist.reduce(function (s, d) { return s + d.count; }, 0);
    if (!total) return 0;
    var n = dist.filter(function (d) {
      var etq = etiquetaEscala(escala, d.valor);
      var etqEs = escala.filter(function (o) { return o.valor === d.valor; })[0];
      return etqEs && etiquetasEs.indexOf(etqEs.es) > -1;
    }).reduce(function (s, d) { return s + d.count; }, 0);
    return Math.round(n / total * 100);
  }

  var selAnio = document.getElementById('sel-anio');
  var selMes = document.getElementById('sel-mes');
  var filtroResultado = document.getElementById('filtro-resultado');

  function poblarSelects(anios) {
    var htmlAnio = '<option value="">' + t.todos + '</option>' +
      anios.map(function (a) { return '<option value="' + a + '">' + a + '</option>'; }).join('');
    selAnio.innerHTML = htmlAnio;

    var htmlMes = '<option value="">' + t.todos + '</option>' +
      t.meses.map(function (nombre, i) {
        var mm = String(i + 1).padStart(2, '0');
        return '<option value="' + mm + '">' + nombre + '</option>';
      }).join('');
    selMes.innerHTML = htmlMes;
  }

  selAnio.addEventListener('change', function () {
    selMes.disabled = !selAnio.value;
    if (!selAnio.value) selMes.value = '';
    cargarResumen();
  });
  selMes.addEventListener('change', function () { cargarResumen(); });

  function cargarResumen() {
    document.getElementById('contenido').innerHTML = '<div class="spinner-wrap">' + t.cargando + '</div>';
    var qs = new URLSearchParams();
    if (selAnio.value) qs.set('anio', selAnio.value);
    if (selAnio.value && selMes.value) qs.set('mes', selMes.value);

    fetch('/consentimiento/encuesta/resumen' + (qs.toString() ? '?' + qs.toString() : ''))
      .then(function (res) { if (!res.ok) throw new Error('bad response'); return res.json(); })
      .then(function (resumen) {
        if (!selAnio.options.length || selAnio.options.length <= 1) {
          poblarSelects(resumen.anios || []);
          selAnio.value = '';
        }

        if (selAnio.value) {
          var etiquetaFiltro = selAnio.value + (selMes.value ? ' · ' + t.meses[parseInt(selMes.value, 10) - 1] : '');
          filtroResultado.textContent = t.mostrando + ': ' + etiquetaFiltro;
        } else {
          filtroResultado.textContent = '';
        }

        var pctSatisfechos = pctEnEtiquetas(resumen.generales.satisfaccion_general, ESCALA4, ['Muy bueno', 'Bueno']);
        var pctRecomienda = pctEnEtiquetas(resumen.generales.recomendaria, ESCALA_RECOMENDACION, ['Definitivamente sí', 'Probablemente sí']);
        var idiomaEs = 0, idiomaEn = 0;
        (resumen.idiomas || []).forEach(function (i) {
          if (i.idioma === 'es') idiomaEs = i.count;
          if (i.idioma === 'en') idiomaEn = i.count;
        });

        var kpisHtml = '<div class="kpi-row">' +
          '<div class="kpi-card"><div class="kpi-num">' + resumen.total + '</div><div class="kpi-label">' + t.totalRespuestas + '</div></div>' +
          '<div class="kpi-card"><div class="kpi-num">' + pctSatisfechos + '%</div><div class="kpi-label">' + t.satisfechos + '</div></div>' +
          '<div class="kpi-card"><div class="kpi-num">' + pctRecomienda + '%</div><div class="kpi-label">' + t.recomiendan + '</div></div>' +
          '<div class="kpi-card"><div class="kpi-num">' + idiomaEs + '</div><div class="kpi-label">' + t.enEspanol + '</div><div class="kpi-sub">' + idiomaEn + ' ' + t.enIngles + '</div></div>' +
          '</div>';

        var piesHtml = '<div class="section-label">🥧 ' + t.seccionPreguntas + '</div><div class="pie-grid">' +
          PREGUNTAS.map(function (p) {
            return '<div class="pie-card"><h4>' + escapeHtml(t[p.tituloKey]) + '</h4>' + buildPieSVG(resumen.generales[p.campo] || [], p.escala) + '</div>';
          }).join('') + '</div>';

        var procTotal = (resumen.procedimientos || []).reduce(function (s, p) { return s + p.count; }, 0) || 1;
        var procRows = (resumen.procedimientos || []).map(function (p, i) {
          var etiqueta = (PROCEDIMIENTOS[p.clave] && PROCEDIMIENTOS[p.clave][lang]) || p.clave;
          var pct = Math.round(p.count / procTotal * 100);
          var color = PALETA[i % PALETA.length];
          return '<div class="proc-row">' +
            '<div class="proc-label" title="' + escapeHtml(etiqueta) + '">' + escapeHtml(etiqueta) + '</div>' +
            '<div class="proc-track"><div class="proc-fill" style="width:' + pct + '%;background:' + color + '"><span class="proc-num">' + p.count + '</span></div></div>' +
            '<div class="proc-pct">' + pct + '%</div>' +
            '</div>';
        }).join('');
        var procHtml = '<div class="section-label">🩺 ' + t.seccionProcedimientos + '</div>' +
          '<div class="proc-card"><p style="font-size:11.5px;color:var(--gris);margin-bottom:12px">' + t.procNota + '</p>' +
          (procRows || '<div class="no-data">' + t.sinDatos + '</div>') + '</div>';

        document.getElementById('contenido').innerHTML = kpisHtml + piesHtml + procHtml;
      })
      .catch(function (err) {
        console.error(err);
        document.getElementById('contenido').innerHTML = '<div class="no-data">' + t.error + '</div>';
      });
  }

  cargarResumen();
})();
</script>
</body>
</html>
