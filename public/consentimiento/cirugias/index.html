<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title id="page-title">Admisión Sala de Cirugías · Stemwell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --verde: #00B2C2; --verde-claro: #E6F7F9; --texto: #1C2B26; --gris: #6B7B76;
    --borde: #D4E6DF; --fondo: #F7FAF8; --blanco: #FFFFFF; --error: #C0392B; --max-w: 560px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Poppins', sans-serif; background: var(--fondo); color: var(--texto); min-height: 100vh; display: flex; flex-direction: column; }
  .header { background: var(--blanco); border-bottom: 1px solid var(--borde); padding: 10px 24px; display: flex; align-items: center; position: sticky; top: 0; z-index: 10; }
  .header img { height: 54px; width: auto; }
  .container { max-width: var(--max-w); width: 100%; margin: 0 auto; padding: 14px 20px 24px; flex: 1; display: flex; flex-direction: column; justify-content: center; }
  @media (min-width: 700px) { :root { --max-w: 680px; } }
  @media (min-width: 1000px) { :root { --max-w: 780px; } }
  .titulo-simple { margin-bottom: clamp(12px, 1.4vh, 18px); }
  .titulo-simple h2 { font-size: clamp(22px, 2.6vw, 32px); font-weight: 800; color: var(--verde); margin-bottom: 6px; }
  .titulo-simple p { font-size: clamp(13px, 1vw, 15px); color: var(--gris); line-height: 1.4; }
  .section { background: var(--blanco); border-radius: 16px; padding: clamp(20px, 4vh, 40px) clamp(22px, 2.2vw, 32px); margin-bottom: clamp(14px, 2.4vh, 22px); border: 1px solid var(--borde); }
  .section-title { font-size: clamp(12px, 1vw, 13.5px); font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--verde); margin-bottom: clamp(10px, 1.8vh, 18px); }
  .field { margin-bottom: clamp(14px, 2.6vh, 24px); }
  .field:last-child { margin-bottom: 0; }
  label.campo-label { display: block; font-size: clamp(12.5px, 1vw, 15px); font-weight: 500; color: var(--gris); margin-bottom: 6px; }
  label.campo-label span.req { color: var(--verde); margin-left: 2px; }
  input[type="text"], input[type="tel"], input[type="email"] {
    width: 100%; padding: clamp(13px, 2.6vh, 20px) 16px; border: 1.5px solid var(--borde); border-radius: 11px;
    font-family: 'Poppins', sans-serif; font-size: clamp(14px, 1.2vw, 17px); color: var(--texto); background: var(--fondo);
    transition: border-color .2s, box-shadow .2s; -webkit-appearance: none;
  }
  input:focus { outline: none; border-color: var(--verde); box-shadow: 0 0 0 3px rgba(0,178,194,.12); background: var(--blanco); }
  input.error { border-color: var(--error); }
  .field-error { font-size: 11.5px; color: var(--error); margin-top: 4px; display: none; }
  .field-error.show { display: block; }

  .row-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  @media (max-width: 460px) { .row-2 { grid-template-columns: 1fr; } }

  .btn-enviar {
    width: 100%; padding: 16px; background: var(--verde); color: white; border: none; border-radius: 14px;
    font-family: 'Poppins', sans-serif; font-size: 16.5px; font-weight: 600; cursor: pointer; transition: all .2s;
    display: flex; align-items: center; justify-content: center; gap: 10px;
  }
  .btn-enviar:hover:not(:disabled) { background: #0093a0; transform: translateY(-1px); box-shadow: 0 6px 20px rgba(0,178,194,.3); }
  .btn-enviar:disabled { opacity: .6; cursor: not-allowed; }
  .btn-secundario {
    padding: 14px 22px; background: none; color: var(--gris); border: 1.5px solid var(--borde); border-radius: 14px;
    font-family: 'Poppins', sans-serif; font-size: 14.5px; font-weight: 500; cursor: pointer; transition: all .2s; white-space: nowrap;
  }
  .btn-secundario:hover { border-color: var(--verde); color: var(--verde); }
  .botones-form { display: flex; gap: 12px; margin-top: 6px; }
  .botones-form .btn-enviar { flex: 1; }
  .spinner { width: 20px; height: 20px; border: 2px solid rgba(255,255,255,.3); border-top-color: white; border-radius: 50%; animation: spin .7s linear infinite; display: none; }
  @keyframes spin { to { transform: rotate(360deg); } }

  #pantalla-exito { display: none; flex-direction: column; align-items: center; text-align: center; padding: 60px 24px; }
  .exito-icono { width: 80px; height: 80px; background: var(--verde-claro); border-radius: 50%; display: flex; align-items: center; justify-content: center; margin-bottom: 22px; }
  .exito-icono svg { width: 40px; height: 40px; }
  #pantalla-exito h2 { font-size: 24px; color: var(--verde); margin-bottom: 10px; font-weight: 700; }
  #pantalla-exito p { font-size: 14.5px; color: var(--gris); line-height: 1.65; max-width: 360px; }

  /* ── EFECTO "RIPPLE" AL TOCAR ── */
  .ripple-host { position: relative; overflow: hidden; }
  .ripple-host:active { transform: scale(.97); }
  .ripple-wave {
    position: absolute; border-radius: 50%; transform: scale(0); opacity: .55;
    background: currentColor; mix-blend-mode: overlay; pointer-events: none;
    animation: ripple-expandir .6s ease-out forwards;
  }
  .ripple-host.ripple-clara .ripple-wave { background: var(--verde); mix-blend-mode: normal; opacity: .18; }
  @keyframes ripple-expandir { to { transform: scale(1); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .ripple-wave { display: none; } }
</style>
</head>
<body>

<header class="header"><img src="/images/STEMWELL_LOGO_.png" alt="Stemwell" /></header>

<div class="container">
  <div id="pantalla-form">
    <div class="titulo-simple">
      <h2 id="txt-titulo">&nbsp;</h2>
      <p id="txt-intro"></p>
    </div>

    <div class="section">
      <div class="section-title" id="txt-section-datos"></div>
      <div class="row-2">
        <div class="field">
          <label class="campo-label" id="lbl-nombre"></label>
          <input type="text" id="nombre" autocomplete="given-name" />
          <div class="field-error" id="err-nombre"></div>
        </div>
        <div class="field">
          <label class="campo-label" id="lbl-apellido"></label>
          <input type="text" id="apellido" autocomplete="family-name" />
          <div class="field-error" id="err-apellido"></div>
        </div>
      </div>
      <div class="field">
        <label class="campo-label" id="lbl-documento"></label>
        <input type="text" id="documento" inputmode="numeric" />
        <div class="field-error" id="err-documento"></div>
      </div>
      <div class="row-2">
        <div class="field">
          <label class="campo-label" id="lbl-correo"></label>
          <input type="email" id="correo" autocomplete="email" />
          <div class="field-error" id="err-correo"></div>
        </div>
        <div class="field">
          <label class="campo-label" id="lbl-telefono"></label>
          <input type="tel" id="telefono" inputmode="tel" autocomplete="tel" />
          <div class="field-error" id="err-telefono"></div>
        </div>
      </div>
    </div>

    <div class="botones-form">
      <button class="btn-secundario" id="btn-inicio" type="button"></button>
      <button class="btn-enviar" id="btn-enviar" type="button">
        <span id="btn-texto"></span>
        <div class="spinner" id="spinner"></div>
      </button>
    </div>
  </div>

  <div id="pantalla-exito">
    <div class="exito-icono">
      <svg viewBox="0 0 24 24" fill="none" stroke="#1A7A5E" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/>
      </svg>
    </div>
    <h2 id="txt-gracias-titulo"></h2>
    <p id="txt-gracias-texto"></p>
  </div>
</div>

<script>
(function () {
  'use strict';

  var TEXTOS = {
    es: {
      tituloPagina: 'Admisión Sala de Cirugías · Stemwell',
      titulo: 'Admisión Sala de Cirugías',
      intro: 'Recepción completa estos datos básicos antes de entregar la tablet al paciente.',
      sectionDatos: 'Datos del paciente',
      nombre: 'Nombre', apellido: 'Apellido', documento: 'Documento',
      correo: 'Correo', telefono: 'Teléfono',
      erNombre: 'Ingresa el nombre', erApellido: 'Ingresa el apellido',
      erDocumento: 'Ingresa el documento', erCorreo: 'Ingresa un correo válido',
      erTelefono: 'Ingresa el teléfono',
      inicio: '← Inicio', enviar: 'Guardar admisión', enviando: 'Guardando…',
      graciasTitulo: '¡Admisión guardada!', graciasTexto: 'El paciente quedó registrado correctamente.',
      errorGuardar: 'Hubo un problema al guardar la admisión. Verifica la conexión e intenta de nuevo.'
    },
    en: {
      tituloPagina: 'Surgery Room Admission · Stemwell',
      titulo: 'Surgery Room Admission',
      intro: 'Front desk fills out this basic information before handing the tablet to the patient.',
      sectionDatos: 'Patient information',
      nombre: 'First name', apellido: 'Last name', documento: 'ID document',
      correo: 'Email', telefono: 'Phone',
      erNombre: 'Enter the first name', erApellido: 'Enter the last name',
      erDocumento: 'Enter the ID document', erCorreo: 'Enter a valid email',
      erTelefono: 'Enter the phone number',
      inicio: '← Home', enviar: 'Save admission', enviando: 'Saving…',
      graciasTitulo: 'Admission saved!', graciasTexto: 'The patient was registered successfully.',
      errorGuardar: 'There was a problem saving the admission. Check your connection and try again.'
    }
  };

  var params = new URLSearchParams(window.location.search);
  var lang = params.get('lang') === 'en' ? 'en' : 'es';
  var t = TEXTOS[lang];
  document.documentElement.lang = lang;

  document.getElementById('page-title').textContent = t.tituloPagina;
  document.getElementById('txt-titulo').textContent = t.titulo;
  document.getElementById('txt-intro').textContent = t.intro;
  document.getElementById('txt-section-datos').textContent = t.sectionDatos;
  document.getElementById('lbl-nombre').innerHTML = t.nombre + ' <span class="req">*</span>';
  document.getElementById('lbl-apellido').innerHTML = t.apellido + ' <span class="req">*</span>';
  document.getElementById('lbl-documento').innerHTML = t.documento + ' <span class="req">*</span>';
  document.getElementById('lbl-correo').innerHTML = t.correo + ' <span class="req">*</span>';
  document.getElementById('lbl-telefono').innerHTML = t.telefono + ' <span class="req">*</span>';
  document.getElementById('err-nombre').textContent = t.erNombre;
  document.getElementById('err-apellido').textContent = t.erApellido;
  document.getElementById('err-documento').textContent = t.erDocumento;
  document.getElementById('err-correo').textContent = t.erCorreo;
  document.getElementById('err-telefono').textContent = t.erTelefono;
  document.getElementById('btn-inicio').textContent = t.inicio;
  document.getElementById('btn-texto').textContent = t.enviar;
  document.getElementById('txt-gracias-titulo').textContent = t.graciasTitulo;
  document.getElementById('txt-gracias-texto').textContent = t.graciasTexto;

  document.getElementById('btn-inicio').addEventListener('click', function () {
    window.location.href = '/consentimiento/?lang=' + lang;
  });

  function marcarError(id, mostrar) {
    var el = document.getElementById('err-' + id);
    var campo = document.getElementById(id);
    if (el) el.classList.toggle('show', mostrar);
    if (campo) campo.classList.toggle('error', mostrar);
  }

  function correoValido(v) { return /\S+@\S+\.\S+/.test(v); }

  function validar() {
    var ok = true;
    if (!document.getElementById('nombre').value.trim()) { marcarError('nombre', true); ok = false; } else marcarError('nombre', false);
    if (!document.getElementById('apellido').value.trim()) { marcarError('apellido', true); ok = false; } else marcarError('apellido', false);
    if (!document.getElementById('documento').value.trim()) { marcarError('documento', true); ok = false; } else marcarError('documento', false);
    var correo = document.getElementById('correo').value.trim();
    if (!correoValido(correo)) { marcarError('correo', true); ok = false; } else marcarError('correo', false);
    if (!document.getElementById('telefono').value.trim()) { marcarError('telefono', true); ok = false; } else marcarError('telefono', false);

    if (!ok) {
      var primerError = document.querySelector('.field-error.show');
      if (primerError) primerError.scrollIntoView({ behavior: 'smooth', block: 'center' });
    }
    return ok;
  }

  document.getElementById('btn-enviar').addEventListener('click', function () {
    if (!validar()) return;
    var btn = document.getElementById('btn-enviar');
    var texto = document.getElementById('btn-texto');
    var spinner = document.getElementById('spinner');
    btn.disabled = true;
    texto.textContent = t.enviando;
    spinner.style.display = 'block';

    var nombre = document.getElementById('nombre').value.trim();
    var apellido = document.getElementById('apellido').value.trim();

    var payload = {
      idioma: lang,
      nombres_apellidos: (nombre + ' ' + apellido).trim(),
      identificacion: document.getElementById('documento').value.trim(),
      correo: document.getElementById('correo').value.trim(),
      telefono: document.getElementById('telefono').value.trim(),
      user_agent: navigator.userAgent
    };

    fetch('/consentimiento/admision-cirugias/guardar', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    }).then(function (res) {
      return res.json().then(function (data) { return { ok: res.ok, data: data }; });
    }).then(function (r) {
      if (r.ok) {
        document.getElementById('pantalla-form').style.display = 'none';
        document.getElementById('pantalla-exito').style.display = 'flex';
        window.scrollTo({ top: 0, behavior: 'smooth' });
        setTimeout(function () {
          window.location.href = '/consentimiento/?lang=' + lang;
        }, 3000);
      } else {
        throw new Error(r.data.mensaje || 'Error del servidor');
      }
    }).catch(function (err) {
      console.error(err);
      alert(t.errorGuardar + '\n\n' + err.message);
    }).finally(function () {
      btn.disabled = false;
      texto.textContent = t.enviar;
      spinner.style.display = 'none';
    });
  });

  // ── EFECTO "RIPPLE" AL TOCAR ──────────────────────────────────────────
  var RIPPLE_SELECTOR = '.btn-enviar, .btn-secundario';
  document.addEventListener('click', function (e) {
    var el = e.target.closest(RIPPLE_SELECTOR);
    if (!el) return;
    el.classList.add('ripple-host');
    if (el.classList.contains('btn-secundario')) el.classList.add('ripple-clara');
    var rect = el.getBoundingClientRect();
    var size = Math.max(rect.width, rect.height) * 1.6;
    var onda = document.createElement('span');
    onda.className = 'ripple-wave';
    onda.style.width = onda.style.height = size + 'px';
    onda.style.left = (e.clientX - rect.left - size / 2) + 'px';
    onda.style.top = (e.clientY - rect.top - size / 2) + 'px';
    el.appendChild(onda);
    setTimeout(function () { onda.remove(); }, 650);
  }, true);
})();
</script>
</body>
</html>
